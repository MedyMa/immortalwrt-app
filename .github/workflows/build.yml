name: Build mobile app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Android 17 SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          flutter doctor -v
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build iOS simulator
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcodebuild -version | grep 'Xcode 27'
          xcrun --sdk iphonesimulator --show-sdk-version | grep '^27\.'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build ios --simulator --debug
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app immortalwrt-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-ios-simulator
          path: immortalwrt-ios-simulator.zip
          if-no-files-found: error
      - name: Launch on iOS 27 simulator
        timeout-minutes: 8
        continue-on-error: true
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtime, devices in data.items() if "iOS-27" in runtime for device in devices if "iPhone" in device["name"]), ""))')
          test -n "$device_id"
          echo "Booting iOS 27 simulator: $device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          echo "Installing Runner.app"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","install",sys.argv[1],"build/ios/iphonesimulator/Runner.app"],check=True,timeout=180)' "$device_id"
          echo "Launching ImmortalWrt"
          if ! python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","launch",sys.argv[1],"com.medyma.immortalwrtApp"],check=True,timeout=120)' "$device_id"; then
            echo "simctl launch did not return; capturing the simulator state for diagnosis"
          fi
          sleep 8
          echo "Capturing iOS 27 screenshot"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","io",sys.argv[1],"screenshot","ios-27-overview.png"],check=True,timeout=60)' "$device_id"
      - uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-ios-27-preview
          path: ios-27-overview.png
          if-no-files-found: warn
