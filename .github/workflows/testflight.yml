name: Publish iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique App Store Connect build number (increase for every upload)
        required: true
        default: '19'

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate build number
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo '::error::Build number must be 1..9999'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify device SDK
        run: |
          xcodebuild -version | grep 'Xcode 27'
          xcrun --sdk iphoneos --show-sdk-version | grep '^27\.'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: python3 tools/test-ios-signing.py
      - run: python3 tools/test-testflight-workflow.py
      # Flutter/CocoaPods and all build phases finish before signing material exists.
      - name: Build unsigned device archive
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: flutter build ipa --release --no-codesign --build-number="$BUILD_NUMBER"
      - name: Import distribution identity and profile
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in IOS_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          echo "::add-mask::$IOS_DISTRIBUTION_P12_PASSWORD"
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist" EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist" python3 tools/prepare-ios-signing.py
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s\n' "$uuid" > "$RUNNER_TEMP/testflight-profile-uuid"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
      # Export signs the existing archive without executing project build phases.
      - name: Export signed device IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || exit 1
          # altool searches ./private_keys. Keep the API key in a disposable directory.
          mkdir -p "$RUNNER_TEMP/testflight-upload/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/testflight-upload/private_keys/AuthKey_$ASC_KEY_ID.p8"
          files=("$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ]
          cd "$RUNNER_TEMP/testflight-upload"
          xcrun altool --validate-app --file "${files[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file "${files[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/testflight-profile-uuid" ]; then
            uuid=$(cat "$RUNNER_TEMP/testflight-profile-uuid")
            if [[ "$uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            fi
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$RUNNER_TEMP/testflight-profile-uuid"
          rm -rf "$RUNNER_TEMP/testflight-upload" "$GITHUB_WORKSPACE/build/ios/ipa"
