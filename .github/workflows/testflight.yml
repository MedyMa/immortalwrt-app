name: Publish iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique App Store Connect build number (increase for every upload)
        required: true
        default: '19'

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 45
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate publishing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo '::error::Build number must be 1..9999'; exit 1; }
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify device SDK
        run: |
          xcodebuild -version | grep 'Xcode 27'
          xcrun --sdk iphoneos --show-sdk-version | grep '^27\.'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: python3 tools/test-ios-signing.py
      - name: Import distribution identity and profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist" EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist" python3 tools/prepare-ios-signing.py
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Build signed device IPA
        run: flutter build ipa --release --build-number="$BUILD_NUMBER" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-ios-signed-${{ inputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          files=(build/ios/ipa/*.ipa)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ]
          xcrun altool --validate-app --file "${files[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file "${files[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          if [ -n "${ASC_KEY_ID:-}" ]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"; fi
