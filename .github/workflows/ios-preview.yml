name: Render native iOS pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-preview.yml', 'tools/prepare-ios-preview.py', 'tools/ios_preview_fixture.dart', 'tools/render-ios-preview.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare isolated preview
        run: python3 tools/prepare-ios-preview.py
      - run: flutter build ios --simulator --debug
      - name: Render all pages in iOS 27
        timeout-minutes: 10
        run: python3 tools/render-ios-preview.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-native-pages
          path: ios-native-pages/*.png
          if-no-files-found: error
